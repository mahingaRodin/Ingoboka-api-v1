# ============================================================
# PRODUCTION PROFILE — application-prod.properties
# Activated by: SPRING_PROFILES_ACTIVE=prod
#
# ALL values here require explicit environment variables.
# No insecure defaults. If a required env var is missing,
# the application will fail to start — this is intentional.
# ============================================================

# ----- Database (Amazon RDS PostgreSQL) -----
# RDS endpoint format: <identifier>.<id>.<region>.rds.amazonaws.com
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ----- Cache (Amazon ElastiCache Redis) -----
# ElastiCache primary endpoint format: <cluster>.cache.amazonaws.com
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

# ----- S3 Document Storage -----
ingoboka.storage.minio.enabled=true
ingoboka.storage.minio.region=${S3_REGION}
ingoboka.storage.minio.bucket=${S3_BUCKET}
ingoboka.storage.minio.public-base-url=${S3_PUBLIC_BASE_URL:}

# ----- JWT (must be a strong random secret, min 256 bits) -----
ingoboka.security.jwt.secret=${JWT_SECRET}

# ----- SMTP -----
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ----- Platform admin seed -----
ingoboka.seed.platform-admin.enabled=${SEED_PLATFORM_ADMIN:false}
ingoboka.seed.platform-admin.email=${PLATFORM_ADMIN_EMAIL}
ingoboka.seed.platform-admin.password=${PLATFORM_ADMIN_PASSWORD}
ingoboka.seed.platform-admin.phone=${PLATFORM_ADMIN_PHONE}

# ----- Frontend URLs -----
ingoboka.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
ingoboka.platform.frontend-login-url=${FRONTEND_LOGIN_URL}
ingoboka.platform.frontend-verify-email-url=${FRONTEND_VERIFY_EMAIL_URL}
ingoboka.platform.frontend-activate-account-url=${FRONTEND_ACTIVATE_ACCOUNT_URL}
ingoboka.platform.frontend-base-url=${FRONTEND_BASE_URL}
ingoboka.platform.brand-logo-url=${BRAND_LOGO_URL}

# ----- OTP -----
ingoboka.security.otp.storage=${OTP_STORAGE:redis}
ingoboka.security.otp.delivery-channel=${OTP_DELIVERY_CHANNEL:email}

# ----- SMS / USSD (optional — disabled by default) -----
ingoboka.sms.africastalking.enabled=${AFRICASTALKING_SMS_ENABLED:false}
ingoboka.sms.africastalking.username=${AFRICASTALKING_USERNAME:sandbox}
ingoboka.sms.africastalking.api-key=${AFRICASTALKING_API_KEY:}
ingoboka.ussd.enabled=${USSD_ENABLED:false}
ingoboka.ussd.session-storage=${USSD_SESSION_STORAGE:redis}

# ----- Actuator (Kubernetes probes) -----
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
