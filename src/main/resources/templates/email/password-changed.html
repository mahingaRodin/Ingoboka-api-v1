Subject: Your Ingoboka password was changed

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password changed</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f7f5;font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1f2937;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f7f5;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e5e7eb;box-shadow:0 4px 24px rgba(0,81,39,0.08);">
          <tr>
            <td style="background:linear-gradient(135deg,#005127 0%,#003d1e 100%);padding:28px 32px;text-align:center;">
              <img src="{{logoUrl}}" alt="Ingoboka" width="160" height="48" style="display:inline-block;max-width:160px;height:auto;"/>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;color:#005127;">Password updated</h1>
              <p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#374151;">Hello {{fullName}},</p>
              <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#374151;">
                Your Ingoboka account password was changed successfully.
              </p>
              <p style="margin:0;font-size:14px;line-height:1.6;color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px 16px;">
                If you did not make this change, contact support immediately.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;background:#f8faf9;border-top:1px solid #e5e7eb;text-align:center;">
              <p style="margin:0;font-size:12px;color:#9ca3af;">© {{year}} Ingoboka · Digital microinsurance for Rwanda</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
