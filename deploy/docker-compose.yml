services:

  nginx:
    image: nginx:1.27-alpine
    container_name: ingoboka-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ingoboka-net

  api:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG:-latest}
    container_name: ingoboka-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # ── Database (Amazon RDS) ──────────────────────────────────────────────
      DB_URL: jdbc:postgresql://${RDS_ENDPOINT}:5432/${DB_NAME:-ingoboka}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # ── Cache (Amazon ElastiCache Redis) ──────────────────────────────────
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      # ── S3 Document Storage ───────────────────────────────────────────────
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      # ── Security ──────────────────────────────────────────────────────────
      JWT_SECRET: ${JWT_SECRET}
      # ── SMTP ──────────────────────────────────────────────────────────────
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_HEALTH_ENABLED: ${MAIL_HEALTH_ENABLED:-false}
      SEED_PLATFORM_ADMIN: ${SEED_PLATFORM_ADMIN:-true}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-platform-admin@example.com}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-change-me-local-admin}
      PLATFORM_ADMIN_PHONE: ${PLATFORM_ADMIN_PHONE:-+250794415318}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://ingoboka-platform.vercel.app,http://localhost:3000}
      FRONTEND_LOGIN_URL: ${FRONTEND_LOGIN_URL:-https://ingoboka-platform.vercel.app/en/login}
      FRONTEND_VERIFY_EMAIL_URL: ${FRONTEND_VERIFY_EMAIL_URL:-https://ingoboka-platform.vercel.app/en/verify-email}
      FRONTEND_ACTIVATE_ACCOUNT_URL: ${FRONTEND_ACTIVATE_ACCOUNT_URL:-https://ingoboka-platform.vercel.app/en/activate}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://ingoboka-platform.vercel.app/en}
      BRAND_LOGO_URL: ${BRAND_LOGO_URL:-https://ingoboka-platform.vercel.app/images/brand/ingoboka-logo.svg}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ingoboka-documents}
      OTP_STORAGE: redis
      OTP_DELIVERY_CHANNEL: ${OTP_DELIVERY_CHANNEL:-email}
      AFRICASTALKING_SMS_ENABLED: ${AFRICASTALKING_SMS_ENABLED:-false}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-sandbox}
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-}
      USSD_ENABLED: ${USSD_ENABLED:-false}
      USSD_SERVICE_CODE: ${USSD_SERVICE_CODE:-*477#}
      USSD_GATEWAY_API_KEY: ${USSD_GATEWAY_API_KEY:-}
      USSD_SESSION_TTL_SECONDS: ${USSD_SESSION_TTL_SECONDS:-120}
      USSD_SESSION_STORAGE: ${USSD_SESSION_STORAGE:-redis}
    networks:
      - ingoboka-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s

networks:
  ingoboka-net:
    driver: bridge
