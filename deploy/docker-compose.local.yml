services:

  postgres:
    image: postgres:16-alpine
    container_name: ingoboka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ingoboka
      POSTGRES_USER: ingoboka
      POSTGRES_PASSWORD: ingoboka_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ingoboka-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingoboka -d ingoboka"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ingoboka-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ingoboka-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ingoboka-api:latest
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/ingoboka
      DB_USERNAME: ingoboka
      DB_PASSWORD: ingoboka_local
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
