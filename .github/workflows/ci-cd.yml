name: CI/CD

# Deploys to Azure VM (docker compose) on push to main.
# Required GitHub secrets:
#   SERVER_HOST      = 4.168.192.169
#   SERVER_USERNAME  = azureuser
#   SERVER_SSH_KEY   = private SSH key (PEM) matching the VM
# Optional:
#   SERVER_SSH_PASSPHRASE = only if the private key is encrypted

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  REMOTE_APP_DIR: /opt/ingoboka

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and test
        run: ./mvnw clean verify -B -Dintegration=true

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Build Docker image (sanity check)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: docker build -t ingoboka-api:${{ github.sha }} .

  deploy:
    needs: build-and-test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare deployment bundle
        run: |
          set -euo pipefail
          mkdir -p bundle/deploy
          cp Dockerfile bundle/
          cp -r deploy/. bundle/deploy/
          # Never ship a local .env — server keeps its own secrets.
          rm -f bundle/deploy/.env
          cp pom.xml mvnw mvnw.cmd bundle/ 2>/dev/null || true
          cp -r .mvn src bundle/
          tar -czf ingoboka-deploy.tar.gz -C bundle .

      - name: Copy bundle to Azure VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: 22
          timeout: 60s
          source: ingoboka-deploy.tar.gz
          target: ${{ env.REMOTE_APP_DIR }}
          overwrite: true

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script: |
            set -euo pipefail
            APP_DIR="${{ env.REMOTE_APP_DIR }}"
            mkdir -p "$APP_DIR/deploy"
            cd "$APP_DIR"

            # Keep server-side secrets across deploys
            if [ -f deploy/.env ]; then
              cp deploy/.env /tmp/ingoboka.env.bak
            fi

            # Remove stale sources (tar does not delete removed files)
            rm -rf src Dockerfile pom.xml mvnw mvnw.cmd .mvn
            tar -xzf ingoboka-deploy.tar.gz
            rm -f ingoboka-deploy.tar.gz

            if [ -f /tmp/ingoboka.env.bak ]; then
              mv /tmp/ingoboka.env.bak deploy/.env
            fi

            if [ ! -f deploy/.env ]; then
              echo "ERROR: deploy/.env missing on server. Create it before CI deploy."
              exit 1
            fi

            cd deploy
            # Prefer docker group; fall back to sudo on fresh Azure VMs
            if docker info >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="sudo docker compose"
            fi

            $DC up -d --build --remove-orphans
            $DC ps

            echo "Waiting for API health..."
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8085/actuator/health/liveness >/dev/null 2>&1 \
                || curl -sf http://127.0.0.1:8085/actuator/health >/dev/null 2>&1; then
                echo "API is healthy"
                curl -s http://127.0.0.1:8085/actuator/health || true
                exit 0
              fi
              sleep 5
            done
            echo "WARNING: health check did not pass in time — check: $DC logs api"
            $DC logs --tail=80 api || true
            exit 1
