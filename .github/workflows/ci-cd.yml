name: CI/CD

# Deploys to AWS EC2 (Docker Compose) on push to main.
# Required GitHub secrets:
#   EC2_HOST      = EC2 Public IP / Elastic IP
#   EC2_USERNAME  = ubuntu
#   EC2_SSH_KEY   = private SSH key (.pem) matching the EC2 instance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  REMOTE_DEPLOY_DIR: /opt/ingoboka/deploy

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and test
        run: ./mvnw clean verify -B -Dintegration=true

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Build Docker image (sanity check)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: docker build -t ingoboka-api:${{ github.sha }} .

  deploy:
    needs: build-and-test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy configs
        run: |
          set -euo pipefail
          mkdir -p bundle
          # Copy only deployment manifests (never send local .env)
          cp deploy/docker-compose.yml bundle/
          cp deploy/nginx.conf bundle/
          tar -czf deploy-configs.tar.gz -C bundle .

      - name: Copy deployment files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          source: deploy-configs.tar.gz
          target: ${{ env.REMOTE_DEPLOY_DIR }}
          overwrite: true

      - name: Deploy on EC2 with Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            set -euo pipefail
            DEPLOY_DIR="${{ env.REMOTE_DEPLOY_DIR }}"
            cd "$DEPLOY_DIR"

            # Untar updated configs
            if [ -f deploy-configs.tar.gz ]; then
              tar -xzf deploy-configs.tar.gz
              rm -f deploy-configs.tar.gz
            fi

            if [ ! -f .env ]; then
              echo "ERROR: .env missing on EC2 server in $DEPLOY_DIR. Create it before deploying."
              exit 1
            fi

            # Prefer docker group; fall back to sudo
            if docker info >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="sudo docker compose"
            fi

            echo "Pulling latest image and updating containers..."
            $DC pull api || true
            $DC up -d --remove-orphans
            $DC ps

            echo "Verifying API health via Nginx on port 80..."
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1/actuator/health >/dev/null 2>&1; then
                echo "API is healthy!"
                curl -s http://127.0.0.1/actuator/health || true
                exit 0
              fi
              echo "Waiting for health check (attempt $i/30)..."
              sleep 5
            done

            echo "ERROR: health check did not pass in time."
            $DC logs --tail=80 api || true
            exit 1